<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Simple Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf2f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .calculator {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #999;
            width: 300px;
        }

        h2 {
            text-align: center;
            color: #1565c0;
        }

        #display {
            width: 100%;
            height: 55px;
            box-sizing: border-box;
            font-size: 26px;
            text-align: right;
            margin-bottom: 15px;
            padding: 10px;
            border: 2px solid #ccc;
            border-radius: 8px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        button {
            height: 55px;
            font-size: 20px;
            border: none;
            border-radius: 8px;
            background: #e3eaf2;
            cursor: pointer;
        }

        button:hover {
            background: #bbdefb;
        }

        .operator {
            background: #90caf9;
        }

        .clear {
            background: #ef5350;
            color: white;
        }

        .equal {
            background: #2e7d32;
            color: white;
        }
    </style>
</head>

<body>
    <div class="calculator">
        <h2>Simple Calculator</h2>

        <input type="text" id="display"
               value="0" readonly>

        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="deleteLast()">DEL</button>
            <button class="operator" onclick="chooseOperator('%')">%</button>
            <button class="operator" onclick="chooseOperator('/')">÷</button>

            <button onclick="addNumber('7')">7</button>
            <button onclick="addNumber('8')">8</button>
            <button onclick="addNumber('9')">9</button>
            <button class="operator" onclick="chooseOperator('*')">×</button>

            <button onclick="addNumber('4')">4</button>
            <button onclick="addNumber('5')">5</button>
            <button onclick="addNumber('6')">6</button>
            <button class="operator" onclick="chooseOperator('-')">−</button>

            <button onclick="addNumber('1')">1</button>
            <button onclick="addNumber('2')">2</button>
            <button onclick="addNumber('3')">3</button>
            <button class="operator" onclick="chooseOperator('+')">+</button>

            <button onclick="addNumber('0')">0</button>
            <button onclick="addNumber('.')">.</button>
            <button class="equal" onclick="calculate()" style="grid-column: span 2">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById("display");

        let firstNumber = null;
        let operator = null;
        let startNewNumber = true;

        function addNumber(number) {
            if (startNewNumber) {
                display.value = number === "." ? "0." : number;
                startNewNumber = false;
            } else if (number === "." && display.value.includes(".")) {
                return;
            } else {
                display.value += number;
            }
        }

        function chooseOperator(op) {
            if (op === "%") {
                display.value = Number(display.value) / 100;
                startNewNumber = true;
                return;
            }

            if (operator !== null && !startNewNumber) {
                calculate();
            }

            firstNumber = Number(display.value);
            operator = op;
            startNewNumber = true;
        }

        function calculate() {
            if (operator === null || firstNumber === null) return;

            const secondNumber = Number(display.value);
            let result;

            switch (operator) {
                case "+": result = firstNumber + secondNumber; break;
                case "-": result = firstNumber - secondNumber; break;
                case "*": result = firstNumber * secondNumber; break;
                case "/":
                    if (secondNumber === 0) {
                        display.value = "Cannot divide by zero";
                        operator = null;
                        firstNumber = null;
                        startNewNumber = true;
                        return;
                    }
                    result = firstNumber / secondNumber;
                    break;
            }

            display.value = String(Number(result.toPrecision(10)));
            firstNumber = null;
            operator = null;
            startNewNumber = true;
        }

        function clearDisplay() {
            display.value = "0";
            firstNumber = null;
            operator = null;
            startNewNumber = true;
        }

        function deleteLast() {
            if (startNewNumber) return;

            display.value = display.value.length > 1
                ? display.value.slice(0, -1)
                : "0";
        }
    </script>
</body>
</html>
